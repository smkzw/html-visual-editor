<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例网页 · 试试编辑我</title>
<style>
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f7f8fa;color:#1f2937}
  .card{max-width:680px;margin:60px auto;background:#fff;border-radius:16px;padding:48px;box-shadow:0 8px 32px rgba(0,0,0,.08)}
  .tag{display:inline-block;background:#002060;color:#fff;font-size:12px;padding:4px 14px;border-radius:20px;margin-bottom:20px}
  h1{color:#ff9900;font-size:34px;margin:0 0 14px}
  p{line-height:1.9;color:#5f6b7a;font-size:15px}
  .btn{display:inline-block;background:#ff9900;color:#fff;padding:12px 30px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:18px}
  .hint{margin-top:26px;padding:14px 18px;background:#fff7e8;border:1px dashed #ff9900;border-radius:10px;font-size:13px;color:#b36b00;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <span class="tag">示例文件</span>
    <h1>双击这段标题试试</h1>
    <p>这是一个示例网页。你可以用编辑器打开它，然后：</p>
    <p>1. <b>双击</b>任意文字，直接修改内容；<br>2. 用顶部工具栏<b>插入</b>图片、形状、表格；<br>3. 用鼠标<b>拖动</b>元素四周的圆点手柄来缩放；<br>4. 改完点<b>保存</b>，或<b>导出</b>一份新文件。</p>
    <a class="btn" href="#">这是一个按钮</a>
    <div class="hint">💡 小提示：改完后如果不想要这些修改，点顶部的「↩ 撤销」即可还原；或者直接关闭页面不保存。</div>
  </div>
</body>
</html>
